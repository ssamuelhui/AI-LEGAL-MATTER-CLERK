[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-clerk"
version = "0.1.0"
description = "Document-grounded AI tool for Canadian legal work (per docs/SoW.docx)."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
    # Phase 3: ChromaDB in EMBEDDED mode, replacing Qdrant. Pinned to 1.x --
    # the API this code targets (configuration={"hnsw": ...}, embedding_function
    # =None, query/get column-oriented results) is the 1.x surface; 0.4.x is a
    # materially different API and would fail at import-time usage, not install.
    "chromadb>=1.5,<2",
    # Phase 3 Session 3: sentence-transformers + torch were replaced by ONNX
    # Runtime. Same model, same vectors -- verified against the live store by
    # tests/acceptance/verify_embedding_parity.py -- and ~700 MB less to ship.
    # chromadb already pulls both of these in, but matter_clerk.embed imports
    # them directly, so they are declared explicitly here on the same reasoning
    # as `requests` below.
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.26",
    "openai>=1.50",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "flask>=3.0",
    "markdown>=3.6",
    "bleach>=6.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pyyaml>=6.0",
    # Phase 2a: the CanLII client. Declared explicitly rather than relied on as
    # a transitive dependency of sentence-transformers — matter_clerk.canlii
    # imports it directly.
    "requests>=2.31",
    # Day 4d export formats. All three are pure Python (no system libraries) —
    # deliberately so: WeasyPrint was evaluated and rejected because its Pango
    # stack does not resolve on Windows without an msys2/GTK install.
    "python-docx>=1.1",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    # Phase 3 Session 3: resolves the packaged build's writable data directory
    # (%LOCALAPPDATA% on Windows). See src/matter_clerk/paths.py.
    "platformdirs>=4.2",
]

[project.scripts]
matter-clerk = "matter_clerk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
